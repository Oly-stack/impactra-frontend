<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Impactra | Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="shortcut icon" href="../img/impactra-logo.jpeg" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="../API.js" defer></script>
    <script src="login.js" defer></script>
  </head>
  <body class="bg-[#f9f9ff] font-['Inter',sans-serif] min-h-screen">
    <main class="min-h-screen flex flex-col items-center justify-center px-6">
      <div class="flex items-center gap-2 mb-5">
        <img src="../img/impactra-logo.jpeg" class="w-[40px] h-auto rounded-lg" />
        <h1 class="text-xl font-bold text-[#111827]">IMPACTRA</h1>
      </div>

      <section class="w-full max-w-[420px] bg-white p-6 rounded-xl shadow-xl">
        <div class="mb-6">
          <h2 class="text-3xl font-bold text-[#111827]">Welcome back</h2>
          <p class="text-sm text-gray-500 mt-1">Enter your details to continue.</p>
        </div>

        <form id="loginForm">
          <!-- STEP 1: Email + Password -->
          <div id="credentialsStep">
            <div class="mb-5">
              <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                Email address
              </label>
              <div class="relative">
                <input
                  type="email"
                  id="email"
                  name="email"
                  placeholder="you@gmail.com"
                  autocomplete="email"
                  class="w-full h-12 rounded-lg border border-gray-200 bg-white px-4 text-sm outline-none transition focus:border-blue-600 focus:ring-2 focus:ring-blue-100"
                  required
                />
              </div>
            </div>

            <div class="mb-4">
              <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                Password
              </label>
              <div class="relative">
                <input
                  type="password"
                  id="password"
                  name="password"
                  placeholder="Enter your password"
                  autocomplete="current-password"
                  class="w-full h-12 rounded-lg border border-gray-200 bg-white px-4 pr-12 text-sm outline-none transition focus:border-blue-600 focus:ring-2 focus:ring-blue-100"
                  required
                />
                <button
                  type="button"
                  id="togglePassword"
                  class="absolute right-4 top-1/2 -translate-y-1/2 text-xs font-semibold text-gray-500 hover:text-gray-800"
                >
                  Show
                </button>
              </div>
            </div>

            <div class="flex items-center justify-between mb-6">
              <label class="flex items-center gap-2 text-sm text-gray-600 cursor-pointer">
                <input type="checkbox" id="remember" class="w-4 h-4 accent-blue-600 cursor-pointer" />
                <span>Remember me</span>
              </label>
              <a href="#" class="text-sm font-semibold text-blue-600 hover:text-blue-700">
                Forgot password?
              </a>
            </div>
          </div>

          <!-- STEP 2: OTP (hidden by default) -->
          <div id="otpStep" class="hidden">
            <p class="text-sm text-gray-600 mb-4 text-center">
              We sent a 6-digit code to <strong id="otpEmailDisplay" class="text-gray-900"></strong>
            </p>

            <div class="flex justify-center gap-2 mb-6">
              <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" class="otp-box w-11 h-12 text-center text-lg font-extrabold text-slate-800 bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600 transition shadow-sm" />
              <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" class="otp-box w-11 h-12 text-center text-lg font-extrabold text-slate-800 bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600 transition shadow-sm" />
              <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" class="otp-box w-11 h-12 text-center text-lg font-extrabold text-slate-800 bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600 transition shadow-sm" />
              <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" class="otp-box w-11 h-12 text-center text-lg font-extrabold text-slate-800 bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600 transition shadow-sm" />
              <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" class="otp-box w-11 h-12 text-center text-lg font-extrabold text-slate-800 bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600 transition shadow-sm" />
              <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" class="otp-box w-11 h-12 text-center text-lg font-extrabold text-slate-800 bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600 transition shadow-sm" />
            </div>

            <div class="flex items-center justify-between mb-6 text-sm">
              <button type="button" id="backToLogin" class="text-gray-500 hover:text-gray-700">
                &larr; Back
              </button>
              <button type="button" id="resendOtpBtn" class="font-semibold text-blue-600 hover:text-blue-700">
                Resend code
              </button>
            </div>
          </div>

          <!-- Submit Button -->
          <button
            type="submit"
            id="submitBtn"
            class="relative w-full h-12 bg-[#0051d5] hover:bg-blue-600 text-white font-medium rounded-lg transition flex items-center justify-center gap-2"
          >
            <span id="submitBtnText">Log in</span>
            <span id="submitBtnArrow" class="text-lg leading-none">&rarr;</span>
          </button>
        </form>

        <p class="text-center text-sm text-gray-500 mt-7">
          Don't have an account?
          <a href="register.html" class="text-blue-600 font-medium hover:text-blue-700">
            Create an account
          </a>
        </p>
      </section>
    </main>
  </body>
</html>
