<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="verification.js" defer></script>
    <link rel="shortcut icon" href="/images/logo.png" type="image/x-icon" />
    <title>Impactra | Email verification</title>
    <script src="API.js" defer></script>
  </head>
  <body class="bg-[#f9f9ff] font-Inter min-h-screen">
    <main class="min-h-screen flex flex-col items-center justify-center px-6">
      <section
        class="w-full flex flex-col items-center justify-content max-w-[540px] bg-white p-6 rounded-xl shadow-xl"
      >
        <div class="flex justify-center mb-4">
          <div class="relative flex items-center justify-center">
            <div
              class="absolute top-0 w-16 h-16 rounded-full bg-[#f0f3ff]"
            ></div>

            <img
              src="../images/verification.png"
              alt="Email"
              class="relative z-10 w-10 h-10 translate-y-8"
            />
          </div>
        </div>

        <h1 class="text-center text-2xl mt-4 font-bold text-[#172235]">
          Check your email
        </h1>

        <p class="text-center text-gray-500 mt-4 text-base">
          We sent a 6-digit verification code to
          <span id="userEmail">mary@youthrise.org</span>
        </p>

        <div class="flex justify-center gap-3 mt-14">
          <input
            type="text"
            maxlength="1"
            class="otp-input w-12 h-12 border border-gray-300 rounded-lg text-center text-xl font-medium outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100"
          />

          <input
            type="text"
            maxlength="1"
            class="otp-input w-12 h-12 border border-gray-300 rounded-lg text-center text-xl font-medium outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100"
          />

          <input
            type="text"
            maxlength="1"
            class="otp-input w-12 h-12 border border-gray-300 rounded-lg text-center text-xl font-medium outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100"
          />

          <input
            type="text"
            maxlength="1"
            class="otp-input w-12 h-12 border border-gray-300 rounded-lg text-center text-xl font-medium outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100"
          />

          <input
            type="text"
            maxlength="1"
            class="otp-input w-12 h-12 border border-gray-300 rounded-lg text-center text-xl font-medium outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100"
          />

          <input
            type="text"
            maxlength="1"
            class="otp-input w-12 h-12 border border-gray-300 rounded-lg text-center text-xl font-medium outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100"
          />
        </div>

        <button
          id="verifyButton"
          type="button"
          class="w-100 h-14 mt-9 bg-[#0051d5] hover:bg-blue-600 text-white rounded-lg font-medium transition"
        >
          Verify Email
        </button>

        <div class="text-center mt-7">
          <p class="text-gray-500 text-sm">Didn't get the code?</p>

          <button
            id="resendButton"
            type="button"
            class="text-blue-600 text-sm font-medium mt-1 hover:text-blue-700"
          >
            Resend code
          </button>
        </div>
      </section>
    </main>
  </body>
</html>
