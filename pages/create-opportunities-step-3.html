<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Review Opportunity | Impactra</title>

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f8fafc; color: #1f2937; }
    header { padding: 20px 8%; background: #fff; border-bottom: 1px solid #e5e7eb; }
    main { max-width: 800px; margin: 40px auto; padding: 30px; background: #fff;
           border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
    .steps { display: flex; justify-content: space-between; gap: 12px;
             margin: 25px 0; color: #64748b; font-size: 14px; }
    .active { color: #4f46e5; font-weight: bold; }
    section { padding: 20px 0; border-bottom: 1px solid #e5e7eb; }
    h2 { font-size: 20px; }
    .detail { margin: 14px 0; line-height: 1.6; overflow-wrap: anywhere; }
    .detail strong { display: block; margin-bottom: 4px; }
    .actions { display: flex; gap: 15px; flex-wrap: wrap; margin-top: 30px; }
    button { padding: 14px 22px; border: 0; border-radius: 8px; cursor: pointer; font-size: 16px; }
    .back { background: #e5e7eb; color: #1f2937; }
    .publish { background: #4f46e5; color: #fff; }
    .publish:hover { background: #4338ca; }
    .publish:disabled { opacity: .6; cursor: not-allowed; }
    .notice { color: #64748b; line-height: 1.6; }
    .back-link { display: inline-block; margin-top: 8px; color: #4f46e5; text-decoration: none; }
    .flow-status { padding: 12px 16px; border-radius: 8px; background: #eef2ff;
                   color: #3730a3; line-height: 1.5; margin-bottom: 16px; }
    .flow-status[data-variant="error"]   { background: #fef2f2; color: #991b1b; }
    .flow-status[data-variant="success"] { background: #ecfdf5; color: #065f46; }
    @media (max-width: 600px) {
      main { margin: 15px; padding: 20px; }
      .steps { font-size: 12px; }
    }
  </style>

  <!-- Load API first, then the workflow controller.
       Both live in the same folder as this file. Do NOT prefix with "../" -->
  <script src="API.js" defer></script>
  <script src="opportunity-workflow.js" defer></script>
</head>

<body data-opportunity-page="step3">

  <header><strong>Impactra</strong></header>

  <main>
    <p id="flowStatus" class="flow-status" role="status" aria-live="polite" hidden></p>

    <h1>Review Your Opportunity</h1>
    <p class="notice">Check your information before publishing.</p>

    <div class="steps">
      <span>1. Basic Information</span>
      <span>2. Details</span>
      <span class="active">3. Review</span>
    </div>

    <section>
      <h2>Basic Information</h2>
      <div id="basicInfo"></div>
    </section>

    <section>
      <h2>Opportunity Details</h2>
      <div id="extraInfo"></div>
    </section>

    <a class="back-link" href="create-opportunities-step-1.html">
      Edit Basic Information
    </a>

    <div class="actions">
      <button class="back" type="button" data-back-to="create-opportunities-step-2.html">
        Back to Details
      </button>

      <button class="publish" id="publishButton" type="button">
        Publish Opportunity
      </button>
    </div>
  </main>

  <script>
    // "Back to Details" — handled here so it doesn't depend on anything else
    document.querySelector("[data-back-to]")?.addEventListener("click", (e) => {
      window.location.href = e.currentTarget.dataset.backTo;
    });
  </script>
</body>
</html>
