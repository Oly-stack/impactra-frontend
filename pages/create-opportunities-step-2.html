<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Opportunity - Step 2 | Impactra</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8fafc;
      color: #1f2937;
    }

    header {
      background: white;
      padding: 20px 8%;
      border-bottom: 1px solid #e5e7eb;
    }

    main {
      max-width: 760px;
      margin: 40px auto;
      padding: 30px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }

    p {
      color: #64748b;
      line-height: 1.6;
    }

    .steps {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin: 25px 0;
      font-size: 14px;
      color: #64748b;
    }

    .active {
      color: #4f46e5;
      font-weight: bold;
    }

    label {
      display: block;
      margin: 20px 0 8px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font: inherit;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: 2px solid #4f46e5;
      outline-offset: 1px;
    }

    .actions {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      margin-top: 25px;
    }

    button {
      padding: 14px 24px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    .back {
      background: #e5e7eb;
      color: #1f2937;
    }

    .continue {
      background: #4f46e5;
      color: white;
    }

    .continue:hover {
      background: #4338ca;
    }

    @media (max-width: 600px) {
      main {
        margin: 15px;
        padding: 20px;
      }

      .steps {
        font-size: 12px;
      }

      .actions {
        flex-wrap: wrap;
      }
    }
  </style>
  <script src="API.js" defer></script>
</head>

<body>

  <header>
    <strong>Impactra</strong>
  </header>

  <main>

    <h1>Create an Opportunity</h1>

    <p>
      Provide additional information about
      your opportunity.
    </p>

    <div class="steps">
      <span>1. Basic Information</span>
      <span class="active">2. Details</span>
      <span>3. Review</span>
    </div>

    <form id="detailsForm">

      <label for="type">Opportunity Type</label>

      <select id="type" required>
        <option value="">Select opportunity type</option>
        <option value="On-site">On-site</option>
        <option value="Remote">Remote</option>
        <option value="Hybrid">Hybrid</option>
      </select>

      <label for="startDate">Start Date</label>

      <input
        type="date"
        id="startDate"
        required
      >

      <label for="endDate">End Date</label>

      <input
        type="date"
        id="endDate"
        required
      >

      <label for="deadline">Application Deadline</label>

      <input
        type="date"
        id="deadline"
        required
      >

      <label for="slots">Number of Available Slots</label>

      <input
        type="number"
        id="slots"
        min="1"
        placeholder="e.g. 20"
        required
      >

      <label for="requirements">Requirements</label>

      <textarea
        id="requirements"
        placeholder="Describe the qualifications or skills needed..."
        required
      ></textarea>

      <label for="benefits">Benefits</label>

      <textarea
        id="benefits"
        placeholder="What will participants gain?"
      ></textarea>

      <div class="actions">

        <button
          type="button"
          class="back"
          onclick="goBack()"
        >
          Back
        </button>

        <button
          type="submit"
          class="continue"
        >
          Save and Continue
        </button>

      </div>

    </form>

  </main>

  <script>
  (() => {
    "use strict";

    /* Toast */
    function toast(message, variant = "default") {
      let host = document.getElementById("toast-host");
      if (!host) {
        host = document.createElement("div");
        host.id = "toast-host";
        host.className =
          "pointer-events-none fixed bottom-6 left-1/2 z-[90] flex -translate-x-1/2 flex-col items-center gap-2";
        document.body.appendChild(host);
      }
      const palette = {
        default: "bg-[#0F172A] text-white",
        success: "bg-[#065F46] text-white",
        error:   "bg-[#991B1B] text-white",
        info:    "bg-[#1D4ED8] text-white",
      };
      const el = document.createElement("div");
      el.className = `pointer-events-auto rounded-lg px-4 py-2.5 text-sm font-medium shadow-lg ${palette[variant]}`;
      el.textContent = message;
      host.appendChild(el);
      setTimeout(() => {
        el.style.transition = "opacity .25s ease, transform .25s ease";
        el.style.opacity = "0";
        el.style.transform = "translateY(8px)";
        setTimeout(() => el.remove(), 260);
      }, 2800);
    }

    /* Field highlighting */
    function markInvalid(field, message) {
      if (!field) return;
      field.classList.add("border-[#F43F5E]", "ring-2", "ring-[#F43F5E]/20");
      field.classList.remove("border-gray-200");
      field.focus();
      toast(message, "error");
    }

    function clearInvalid(field) {
      if (!field) return;
      field.classList.remove("border-[#F43F5E]", "ring-2", "ring-[#F43F5E]/20");
      field.classList.add("border-gray-200");
    }

    /* Back button */
    window.goBack = function () {
      window.location.href = "create-opportunity-step-one.html";
    };

    const form = document.getElementById("detailsForm");
    if (!form) return;

    const typeInput         = document.getElementById("type");
    const startDateInput    = document.getElementById("startDate");
    const endDateInput      = document.getElementById("endDate");
    const deadlineInput     = document.getElementById("deadline");
    const slotsInput        = document.getElementById("slots");
    const requirementsInput = document.getElementById("requirements");
    const benefitsInput     = document.getElementById("benefits");

    const DRAFT_KEY = "impactraOpportunityDraft";

    /* Restore draft if user came back */
    try {
      const raw = sessionStorage.getItem(DRAFT_KEY);
      if (raw) {
        const draft = JSON.parse(raw);
        if (draft.type        && typeInput)         typeInput.value = draft.type;
        if (draft.startDate   && startDateInput)    startDateInput.value = draft.startDate;
        if (draft.endDate     && endDateInput)      endDateInput.value = draft.endDate;
        if (draft.deadline    && deadlineInput)     deadlineInput.value = draft.deadline;
        if (draft.slots != null && slotsInput)      slotsInput.value = draft.slots;
        if (draft.requirements && requirementsInput) requirementsInput.value = draft.requirements;
        if (draft.benefits     && benefitsInput)     benefitsInput.value = draft.benefits;
      }
    } catch (_) { /* ignore corrupt draft */ }

    /* Clear invalid state on input */
    [typeInput, startDateInput, endDateInput, deadlineInput,
     slotsInput, requirementsInput, benefitsInput].forEach((el) => {
      if (!el) return;
      el.addEventListener("input", () => clearInvalid(el));
      el.addEventListener("change", () => clearInvalid(el));
    });

    /* Date sanity check helper */
    function parseDate(str) {
      if (!str) return null;
      const d = new Date(str);
      return isNaN(d.getTime()) ? null : d;
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const type         = typeInput?.value || "";
      const startDate    = startDateInput?.value || "";
      const endDate      = endDateInput?.value || "";
      const deadline     = deadlineInput?.value || "";
      const slotsRaw     = slotsInput?.value || "";
      const requirements = requirementsInput?.value.trim() || "";
      const benefits     = benefitsInput?.value.trim() || "";

      /*  Required fields  */
      if (!type) {
        markInvalid(typeInput, "Please choose an opportunity type");
        return;
      }
      if (!startDate) {
        markInvalid(startDateInput, "Please pick a start date");
        return;
      }
      if (!endDate) {
        markInvalid(endDateInput, "Please pick an end date");
        return;
      }
      if (!deadline) {
        markInvalid(deadlineInput, "Please pick an application deadline");
        return;
      }
      if (!slotsRaw || Number(slotsRaw) < 1) {
        markInvalid(slotsInput, "Please enter at least 1 volunteer slot");
        return;
      }
      if (!requirements) {
        markInvalid(requirementsInput, "Please list the volunteer requirements");
        return;
      }
      if (!benefits) {
        markInvalid(benefitsInput, "Please describe the volunteer benefits");
        return;
      }

      /*  Date logic  */
      const start    = parseDate(startDate);
      const end      = parseDate(endDate);
      const deadlineD = parseDate(deadline);

      if (start && end && end < start) {
        markInvalid(endDateInput, "End date can't be before the start date");
        return;
      }
      if (start && deadlineD && deadlineD > start) {
        markInvalid(deadlineInput, "Deadline must be on or before the start date");
        return;
      }

      /*  Build details object  */
      const details = {
        type,
        startDate,
        endDate,
        deadline,
        slots: Number(slotsRaw),
        requirements,
        benefits,
      };

      /*  Busy state  */
      const submitBtn = form.querySelector('button[type="submit"]');
      const original  = submitBtn ? submitBtn.innerHTML : "";
      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.classList.add("opacity-80", "cursor-not-allowed");
        submitBtn.innerHTML = "Saving…";
      }

      try {
        const savedDraft = JSON.parse(
          sessionStorage.getItem(DRAFT_KEY) || "{}"
        );

        const updatedDraft = { ...savedDraft, ...details };

        sessionStorage.setItem(DRAFT_KEY, JSON.stringify(updatedDraft));

        toast("Details saved — continuing…", "success");
        setTimeout(() => {
          window.location.href = "create-opportunities-steps-3.html";
        }, 500);

      } catch (error) {
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.classList.remove("opacity-80", "cursor-not-allowed");
          submitBtn.innerHTML = original;
        }
        console.error("[create-opportunity step 2] draft save failed:", error);
        toast("Unable to save your information — please try again", "error");
      }
    });
  })();
</script>

</body>
</html>
