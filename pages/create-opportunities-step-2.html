<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Opportunity - Step 2 | Impactra</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8fafc;
      color: #1f2937;
    }

    header {
      background: white;
      padding: 20px 8%;
      border-bottom: 1px solid #e5e7eb;
    }

    main {
      max-width: 760px;
      margin: 40px auto;
      padding: 30px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }

    p {
      color: #64748b;
      line-height: 1.6;
    }

    .steps {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin: 25px 0;
      font-size: 14px;
      color: #64748b;
    }

    .active {
      color: #4f46e5;
      font-weight: bold;
    }

    label {
      display: block;
      margin: 20px 0 8px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font: inherit;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: 2px solid #4f46e5;
      outline-offset: 1px;
    }

    .actions {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      margin-top: 25px;
    }

    button {
      padding: 14px 24px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    .back {
      background: #e5e7eb;
      color: #1f2937;
    }

    .continue {
      background: #4f46e5;
      color: white;
    }

    .continue:hover {
      background: #4338ca;
    }

    @media (max-width: 600px) {
      main {
        margin: 15px;
        padding: 20px;
      }

      .steps {
        font-size: 12px;
      }

      .actions {
        flex-wrap: wrap;
      }
    }
  </style>
  <link rel="stylesheet" href="opportunities.css">
  <script src="../API.js" defer></script>
  <script src="opportunities.js" defer></script>
</head>

<body data-opportunity-page="details">

  <header>
    <strong>Impactra</strong>
  </header>

  <main>
  <p id="flowStatus" class="flow-status" role="status" aria-live="polite" hidden></p>

    <h1>Create an Opportunity</h1>

    <p>
      Provide additional information about
      your opportunity.
    </p>

    <div class="steps">
      <span>1. Basic Information</span>
      <span class="active">2. Details</span>
      <span>3. Review</span>
    </div>

    <form id="detailsForm">

      <label for="type">Opportunity Type</label>

      <select id="type" required>
        <option value="">Select opportunity type</option>
        <option value="On-site">On-site</option>
        <option value="Remote">Remote</option>
        <option value="Hybrid">Hybrid</option>
      </select>

      <label for="startDate">Start Date</label>

      <input
        type="date"
        id="startDate"
        required
      >

      <label for="endDate">End Date</label>

      <input
        type="date"
        id="endDate"
        required
      >

      <label for="deadline">Application Deadline</label>

      <input
        type="date"
        id="deadline"
        required
      >

      <label for="slots">Number of Available Slots</label>

      <input
        type="number"
        id="slots"
        min="1"
        step="1"
        placeholder="e.g. 20"
        required
      >

      <label for="requirements">Requirements</label>

      <textarea
        id="requirements"
        placeholder="Describe the qualifications or skills needed..."
        required
      ></textarea>

      <label for="benefits">Benefits (optional)</label>

      <textarea
        id="benefits"
        placeholder="What will participants gain?"
      ></textarea>

      <div class="actions">

        <button
          type="button"
          class="back"
          data-back-to="create-opportunities-step-1.html"
        >
          Back
        </button>

        <button
          type="submit"
          class="continue"
        >
          Save and Continue
        </button>

      </div>

    </form>

  </main>

  <noscript><p>Please enable JavaScript to use the opportunity screens.</p></noscript>
</body>
</html>
