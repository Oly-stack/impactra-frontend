<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Opportunity - Step 1 | Impactra</title>
  <link rel="shortcut icon" href="img/impactra-logo.jpeg" type="image/x-icon" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f8fafc; color: #1f2937; }
    header { background: white; padding: 20px 8%; border-bottom: 1px solid #e5e7eb; }
    main { max-width: 760px; margin: 40px auto; padding: 30px; background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
    h1 { margin-bottom: 10px; }
    p.lead { line-height: 1.6; color: #64748b; }
    .steps { display: flex; justify-content: space-between; gap: 10px; margin: 25px 0; font-size: 14px; color: #64748b; }
    .active { color: #4f46e5; font-weight: bold; }
    label { display: block; margin: 20px 0 8px; font-weight: bold; }
    input, select, textarea { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; }
    input:focus, select:focus, textarea:focus { outline: 2px solid #4f46e5; outline-offset: 1px; }
    textarea { min-height: 120px; resize: vertical; }
    button { background: #4f46e5; color: white; border: none; border-radius: 8px; padding: 14px 24px; margin-top: 25px; cursor: pointer; font-size: 16px; }
    button:hover { background: #4338ca; }
    .radio-row { display: flex; gap: 16px; margin-top: 8px; }
    .radio-row label { display: flex; align-items: center; gap: 6px; font-weight: normal; margin: 0; }
    .radio-row input[type="radio"] { width: auto; }
    #coverPreview { max-height: 180px; border-radius: 8px; margin-top: 10px; }
  </style>
  <script src="../API.js" defer></script>
  <script src="opportunity-workflow.js" defer></script>
</head>
<body>
  <header><strong>Impactra</strong></header>
  <main>
    <h1>Create an Opportunity</h1>
    <p class="lead">Share an opportunity and connect with people ready to make an impact.</p>

    <div class="steps">
      <span class="active">1. Basic Information</span>
      <span>2. Details &amp; Schedule</span>
      <span>3. Review</span>
    </div>

    <form id="opportunityForm" novalidate>
      <label for="title">Opportunity Title *</label>
      <input id="title" type="text" maxlength="120" placeholder="e.g. Food Relief Distribution" required />

      <label for="category">Category *</label>
      <select id="category" required>
        <option value="">Select a category</option>
      </select>

      <label for="description">Short Description *</label>
      <textarea id="description" maxlength="1000" placeholder="Briefly describe the opportunity..." required></textarea>

      <label>Location Type *</label>
      <div class="radio-row">
        <label><input type="radio" name="locationType" value="in_person" checked /> In-person</label>
        <label><input type="radio" name="locationType" value="remote" /> Remote</label>
        <label><input type="radio" name="locationType" value="hybrid" /> Hybrid</label>
      </div>

      <div>
        <label for="venueAddress">Venue Address *</label>
        <input id="venueAddress" type="text" placeholder="e.g. Surulere Community Hall, 14 Bishop Street" />
      </div>

      <div>
        <label for="hubRegion">Hub Region *</label>
        <input id="hubRegion" type="text" placeholder="e.g. Surulere, Lagos" />
      </div>

      <label for="volunteerCapacity">Volunteer Capacity *</label>
      <input id="volunteerCapacity" type="number" min="1" placeholder="e.g. 25" required />

      <label for="coverImage">Cover Image *</label>
      <input id="coverImage" type="file" accept="image/*" required />
      <img id="coverPreview" class="hidden" alt="Cover preview" />

      <button type="submit">Save and Continue</button>
    </form>
  </main>
</body>
</html>
