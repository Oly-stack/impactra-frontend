<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Create Opportunity - Step 1 | Impactra</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8fafc;
      color: #1f2937;
    }

    header {
      background: white;
      padding: 20px 8%;
      border-bottom: 1px solid #e5e7eb;
    }

    main {
      max-width: 760px;
      margin: 40px auto;
      padding: 30px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      line-height: 1.6;
      color: #64748b;
    }

    .steps {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin: 25px 0;
      font-size: 14px;
      color: #64748b;
    }

    .active {
      color: #4f46e5;
      font-weight: bold;
    }

    label {
      display: block;
      margin: 20px 0 8px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font: inherit;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: 2px solid #4f46e5;
      outline-offset: 1px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 14px 24px;
      margin-top: 25px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #4338ca;
    }

    @media (max-width: 600px) {
      main {
        margin: 15px;
        padding: 20px;
      }

      .steps {
        font-size: 12px;
      }
    }
  </style>
   <script src="API.js" defer></script>
</head>

<body>

  <header>
    <strong>Impactra</strong>
  </header>

  <main>

    <h1>Create an Opportunity</h1>

    <p>
      Share an opportunity and connect with
      people ready to make an impact.
    </p>

    <div class="steps">
      <span class="active">1. Basic Information</span>
      <span>2. Details</span>
      <span>3. Review</span>
    </div>

    <form id="opportunityForm">

      <label for="title">
        Opportunity Title
      </label>

      <input
        type="text"
        id="title"
        name="title"
        placeholder="e.g. Community Outreach Volunteer"
        required
      >

      <label for="category">
        Opportunity Category
      </label>

      <select
        id="category"
        name="category"
        required
      >
        <option value="">
          Select a category
        </option>

        <option value="Volunteering">
          Volunteering
        </option>

        <option value="Internship">
          Internship
        </option>

        <option value="Mentorship">
          Mentorship
        </option>

        <option value="Training">
          Training
        </option>

        <option value="Community Development">
          Community Development
        </option>
      </select>

      <label for="location">
        Location
      </label>

      <input
        type="text"
        id="location"
        name="location"
        placeholder="e.g. Lagos, Nigeria or Remote"
        required
      >

      <label for="description">
        Brief Description
      </label>

      <textarea
        id="description"
        name="description"
        placeholder="Briefly describe the opportunity..."
        required
      ></textarea>

      <button type="submit">
        Save and Continue
      </button>

    </form>

  </main>

  <script>
  (() => {
    "use strict";

    /* Toast */
    function toast(message, variant = "default") {
      let host = document.getElementById("toast-host");
      if (!host) {
        host = document.createElement("div");
        host.id = "toast-host";
        host.className =
          "pointer-events-none fixed bottom-6 left-1/2 z-[90] flex -translate-x-1/2 flex-col items-center gap-2";
        document.body.appendChild(host);
      }
      const palette = {
        default: "bg-[#0F172A] text-white",
        success: "bg-[#065F46] text-white",
        error:   "bg-[#991B1B] text-white",
        info:    "bg-[#1D4ED8] text-white",
      };
      const el = document.createElement("div");
      el.className = `pointer-events-auto rounded-lg px-4 py-2.5 text-sm font-medium shadow-lg ${palette[variant]}`;
      el.textContent = message;
      host.appendChild(el);
      setTimeout(() => {
        el.style.transition = "opacity .25s ease, transform .25s ease";
        el.style.opacity = "0";
        el.style.transform = "translateY(8px)";
        setTimeout(() => el.remove(), 260);
      }, 2800);
    }

    /* Field highlighting */
    function markInvalid(field, message) {
      if (!field) return;
      field.classList.add("border-[#F43F5E]", "ring-2", "ring-[#F43F5E]/20");
      field.classList.remove("border-gray-200");
      field.focus();
      toast(message, "error");
    }

    function clearInvalid(field) {
      if (!field) return;
      field.classList.remove("border-[#F43F5E]", "ring-2", "ring-[#F43F5E]/20");
      field.classList.add("border-gray-200");
    }

    const form = document.getElementById("opportunityForm");
    if (!form) return;

    const titleInput       = document.getElementById("title");
    const categoryInput    = document.getElementById("category");
    const locationInput    = document.getElementById("location");
    const descriptionInput = document.getElementById("description");

    const DRAFT_KEY = "impactraOpportunityDraft";

    /* Restore draft if the user came back */
    try {
      const raw = sessionStorage.getItem(DRAFT_KEY);
      if (raw) {
        const draft = JSON.parse(raw);
        if (draft.title && titleInput)             titleInput.value = draft.title;
        if (draft.category && categoryInput)       categoryInput.value = draft.category;
        if (draft.location && locationInput)       locationInput.value = draft.location;
        if (draft.description && descriptionInput) descriptionInput.value = draft.description;
      }
    } catch (_) { /* ignore corrupt draft */ }

    /* Clear red rings on input */
    [titleInput, categoryInput, locationInput, descriptionInput].forEach((el) => {
      if (!el) return;
      el.addEventListener("input", () => clearInvalid(el));
      el.addEventListener("change", () => clearInvalid(el));
    });

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const opportunity = {
        title:       titleInput?.value.trim() || "",
        category:    categoryInput?.value || "",
        location:    locationInput?.value.trim() || "",
        description: descriptionInput?.value.trim() || "",
      };

      /* Validation */
      if (!opportunity.title) {
        markInvalid(titleInput, "Please enter a title for the opportunity");
        return;
      }
      if (opportunity.title.length < 4) {
        markInvalid(titleInput, "Title is a bit short — try at least 4 characters");
        return;
      }
      if (!opportunity.category) {
        markInvalid(categoryInput, "Please choose a category");
        return;
      }
      if (!opportunity.location) {
        markInvalid(locationInput, "Please enter a location");
        return;
      }
      if (!opportunity.description) {
        markInvalid(descriptionInput, "Please add a short description");
        return;
      }
      if (opportunity.description.length < 20) {
        markInvalid(descriptionInput, "Description is too short — add at least 20 characters");
        return;
      }

      /* Busy state */
      const submitBtn = form.querySelector('button[type="submit"]');
      const original  = submitBtn ? submitBtn.innerHTML : "";
      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.classList.add ("opacity-80", "cursor-not-allowed");
        submitBtn.innerHTML = "Saving…";
      }

      try {
        sessionStorage.setItem(DRAFT_KEY, JSON.stringify(opportunity));

        toast("Draft saved — continuing…", "success");
        setTimeout(() => {
          window.location.href = "create-opportunities-step-2.html";
        }, 500);

      } catch (error) {
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.classList.remove("opacity-80", "cursor-not-allowed");
          submitBtn.innerHTML = original;
        }
        console.error("[create-opportunity] draft save failed:", error);
        toast("Unable to save your draft — please try again", "error");
      }
    });
  })();
</script>

</body>
</html>
