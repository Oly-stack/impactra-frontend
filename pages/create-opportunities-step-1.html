<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Create Opportunity - Step 1 | Impactra</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8fafc;
      color: #1f2937;
    }

    header {
      background: white;
      padding: 20px 8%;
      border-bottom: 1px solid #e5e7eb;
    }

    main {
      max-width: 760px;
      margin: 40px auto;
      padding: 30px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      line-height: 1.6;
      color: #64748b;
    }

    .steps {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin: 25px 0;
      font-size: 14px;
      color: #64748b;
    }

    .active {
      color: #4f46e5;
      font-weight: bold;
    }

    label {
      display: block;
      margin: 20px 0 8px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font: inherit;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: 2px solid #4f46e5;
      outline-offset: 1px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 14px 24px;
      margin-top: 25px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #4338ca;
    }

    @media (max-width: 600px) {
      main {
        margin: 15px;
        padding: 20px;
      }

      .steps {
        font-size: 12px;
      }
    }
  </style>
   <script src="API.js" defer></script>
</head>

<body>

  <header>
    <strong>Impactra</strong>
  </header>

  <main>

    <h1>Create an Opportunity</h1>

    <p>
      Share an opportunity and connect with
      people ready to make an impact.
    </p>

    <div class="steps">
      <span class="active">1. Basic Information</span>
      <span>2. Details</span>
      <span>3. Review</span>
    </div>

    <form id="opportunityForm">

      <label for="title">
        Opportunity Title
      </label>

      <input
        type="text"
        id="title"
        name="title"
        placeholder="e.g. Community Outreach Volunteer"
        required
      >

      <label for="category">
        Opportunity Category
      </label>

      <select
        id="category"
        name="category"
        required
      >
        <option value="">
          Select a category
        </option>

        <option value="Volunteering">
          Volunteering
        </option>

        <option value="Internship">
          Internship
        </option>

        <option value="Mentorship">
          Mentorship
        </option>

        <option value="Training">
          Training
        </option>

        <option value="Community Development">
          Community Development
        </option>
      </select>

      <label for="location">
        Location
      </label>

      <input
        type="text"
        id="location"
        name="location"
        placeholder="e.g. Lagos, Nigeria or Remote"
        required
      >

      <label for="description">
        Brief Description
      </label>

      <textarea
        id="description"
        name="description"
        placeholder="Briefly describe the opportunity..."
        required
      ></textarea>

      <button type="submit">
        Save and Continue
      </button>

    </form>

  </main>

  <script>

    const form = document.getElementById(
      "opportunityForm"
    );

    form.addEventListener("submit", function(event) {

      event.preventDefault();

      const opportunity = {
        title: document.getElementById("title").value.trim(),

        category: document.getElementById("category").value,

        location: document.getElementById("location").value.trim(),

        description: document.getElementById("description").value.trim()
      };

      if (
        !opportunity.title ||
        !opportunity.category ||
        !opportunity.location ||
        !opportunity.description
      ) {
        alert("Please complete all required fields.");
        return;
      }

      try {

        sessionStorage.setItem(
  "impactraOpportunityDraft",
  JSON.stringify(opportunity)
);

window.location.href = "create-opportunities-step-2.html";

} catch (error) {

  alert(
    "Unable to save your draft. Please try again."
        );

      }

    });

  </script>

</body>
</html>
