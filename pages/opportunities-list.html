<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opportunities | Impactra</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8fafc;
      color: #1f2937;
    }

    header {
      background: white;
      padding: 20px 8%;
      border-bottom: 1px solid #e5e7eb;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 40px 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .search {
      width: 100%;
      padding: 14px;
      margin: 20px 0;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 16px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
    }

    .card[hidden] {
      display: none;
    }

    .card h2 {
      font-size: 20px;
    }

    .card p {
      line-height: 1.6;
    }

    .card a {
      display: inline-block;
      padding: 10px 16px;
      background: #4f46e5;
      color: white;
      text-decoration: none;
      border-radius: 6px;
    }

    .card a:hover {
      background: #4338ca;
    }

    #empty {
      margin-top: 20px;
    }
  </style>
  <link rel="stylesheet" href="opportunities.css">
  <script src="../API.js" defer></script>
  <script src="opportunities.js" defer></script>
</head>

<body data-opportunity-page="list">

  <header>
    <strong>Impactra</strong>
  </header>

  <main>
  <p id="flowStatus" class="flow-status" role="status" aria-live="polite" hidden></p>

    <nav class="page-actions" aria-label="Opportunity navigation"><a href="../Dashboard.html">Dashboard</a><a href="create-opportunities-step-1.html">Create Opportunity</a></nav>
    <h1>Explore Opportunities</h1>
    <p>Discover opportunities to make an impact.</p>

    <input
      class="search"
      id="search"
      type="search"
      placeholder="Search opportunities..."
      aria-label="Search opportunities"
    >

    <section class="grid" id="opportunities" aria-label="Opportunities" aria-busy="true"></section>

    <p id="empty" role="status" hidden>No matching opportunities found.</p>

  </main>

  <noscript><p>Please enable JavaScript to use the opportunity screens.</p></noscript>
</body>
</html>
