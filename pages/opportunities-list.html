<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opportunities | Impactra</title>
  <link rel="shortcut icon" href="img/impactra-logo.jpeg" type="image/x-icon" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f8fafc; color: #1f2937; }
    header { background: white; padding: 20px 8%; border-bottom: 1px solid #e5e7eb; }
    main { max-width: 1100px; margin: auto; padding: 40px 20px; }
    h1 { margin-bottom: 10px; }
    .search { width: 100%; padding: 14px; margin: 20px 0; border: 1px solid #d1d5db; border-radius: 8px; font-size: 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
    .card { background: white; padding: 24px; border-radius: 12px; border: 1px solid #e5e7eb; }
    .card h2 { font-size: 20px; margin-top: 0; }
    .card p { line-height: 1.6; }
    #empty { display: none; margin-top: 20px; color: #64748b; }
  </style>
  <script src="../API.js" defer></script>
  <script src="opportunity-workflow.js" defer></script>
</head>
<body>
  <header><strong>Impactra</strong></header>
  <main>
    <h1>Explore Opportunities</h1>
    <p>Discover opportunities to make an impact.</p>
    <input class="search" id="search" type="search" placeholder="Search opportunities..." aria-label="Search opportunities" />
    <section class="grid" id="opportunities"></section>
    <p id="empty">No matching opportunities found.</p>
  </main>
</body>
</html>
