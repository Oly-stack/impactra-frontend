<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Impactra | Create Account</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="shortcut icon" href="../images/logo.png" type="image/x-icon" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <script src="../API.js" defer></script>
    <script src="register.js" defer></script>
  </head>
  <body class="min-h-screen bg-[#f9f9ff] flex flex-col justify-between p-6 font-['Inter',sans-serif]">
    <main class="flex flex-col items-center justify-center flex-1">
      <section class="w-full max-w-[560px] bg-white p-8 rounded-2xl shadow-xl border border-gray-100">
        <h1 class="text-center text-3xl font-bold text-[#172235] mb-8">
          Create account
        </h1>

        <form id="registerForm">
          <!-- Full Name -->
          <div class="mb-5">
            <label for="fullName" class="block text-xs font-bold text-[#172235] mb-2">
              FULL NAME
            </label>
            <div class="relative">
              <img src="../images/user.png" alt="" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 pointer-events-none opacity-60" />
              <input
                type="text"
                id="fullName"
                placeholder="Toyin Okojie"
                class="w-full h-11 rounded-lg bg-[#f0f2ff] pl-11 pr-4 text-sm text-[#172235] outline-none focus:ring-2 focus:ring-[#0051d5]"
                required
              />
            </div>
          </div>

          <!-- Email -->
          <div class="mb-5">
            <label for="email" class="block text-xs font-bold text-[#172235] mb-2">
              EMAIL ADDRESS
            </label>
            <div class="relative">
              <img src="../images/email.png" alt="" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-3 pointer-events-none opacity-60" />
              <input
                type="email"
                id="email"
                placeholder="Enter your email address"
                class="w-full h-11 rounded-lg bg-[#f0f2ff] pl-11 pr-4 text-sm text-[#172235] outline-none focus:ring-2 focus:ring-[#0051d5]"
                required
              />
            </div>
          </div>

          <!-- Phone -->
          <div class="mb-5">
            <label class="block text-xs font-bold text-[#172235] mb-2">
              PHONE NUMBER
            </label>
            <div class="flex gap-2">
              <div class="w-[80px] h-11 rounded-lg bg-[#f0f2ff] text-sm font-medium text-[#172235] flex items-center justify-center gap-1 cursor-default select-none">
                +234 <span class="text-xs">⌄</span>
              </div>
              <div class="relative flex-1">
                <img src="../images/phone.png" alt="" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 pointer-events-none opacity-60" />
                <input
                  type="tel"
                  id="phone"
                  placeholder="Enter your phone number"
                  class="w-full h-11 rounded-lg bg-[#f0f2ff] pl-11 pr-4 text-sm text-[#172235] outline-none focus:ring-2 focus:ring-[#0051d5]"
                />
              </div>
            </div>
          </div>

          <!-- Password -->
          <div class="mb-5">
            <label for="password" class="block text-xs font-bold text-[#172235] mb-2">
              PASSWORD
            </label>
            <div class="relative">
              <img src="../images/password.png" alt="" class="absolute left-4 top-1/2 -translate-y-1/2 w-3.5 h-4 pointer-events-none opacity-60" />
              <input
                type="password"
                id="password"
                placeholder="Create a password"
                class="w-full h-11 rounded-lg bg-[#f0f2ff] pl-11 pr-12 text-sm text-[#172235] outline-none focus:ring-2 focus:ring-[#0051d5]"
                required
              />
              <button type="button" id="togglePassword" class="absolute right-4 top-1/2 -translate-y-1/2 cursor-pointer p-1">
                <img id="eyeIcon" src="../images/eye.png" alt="Show password" class="w-4 h-3.5 opacity-60" />
              </button>
            </div>
          </div>

          <!-- Confirm password -->
          <div class="mb-1">
            <label for="confirmPassword" class="block text-xs font-bold text-[#172235] mb-2">
              RE-ENTER PASSWORD
            </label>
            <div class="relative">
              <img src="../images/password.png" alt="" class="absolute left-4 top-1/2 -translate-y-1/2 w-3.5 h-4 pointer-events-none opacity-60" />
              <input
                type="password"
                id="confirmPassword"
                placeholder="Re-enter password"
                class="w-full h-11 rounded-lg bg-[#f0f2ff] pl-11 pr-12 text-sm text-[#172235] outline-none focus:ring-2 focus:ring-[#0051d5]"
                required
              />
              <button type="button" id="toggleConfirmPassword" class="absolute right-4 top-1/2 -translate-y-1/2 cursor-pointer p-1">
                <img id="confirmEyeIcon" src="../images/eye.png" alt="Show password" class="w-4 h-3.5 opacity-60" />
              </button>
            </div>
          </div>

          <p class="text-[11px] text-gray-500 mb-6">
            Must contain at least 8 characters, one number, and a symbol.
          </p>

          <!-- Choose account type -->
          <h2 class="text-sm font-semibold text-[#172235] mb-3">
            Choose your account type
          </h2>

          <div class="grid grid-cols-2 gap-3 mb-6">
            <!-- NGO / Organization -->
            <button
              type="button"
              data-role="organization"
              class="account-card text-left rounded-2xl border-2 border-[#0051d5] bg-[#f0f2ff] p-4 shadow-sm transition-all"
            >
              <div class="flex items-center justify-between">
                <div class="w-9 h-9 rounded-xl bg-[#0051d5] flex items-center justify-center">
                  <img src="../images/page.png" alt="" class="w-4 h-4" />
                </div>
                <span
                  data-role-check
                  class="bg-[#0051d5] flex items-center gap-1 text-white text-[10px] font-semibold rounded-full px-2 py-0.5"
                >
                  <img src="../images/tick.png" class="w-2.5 h-2" />
                  SELECTED
                </span>
              </div>
              <h3 class="font-bold text-sm text-[#172235] mt-3">Organization</h3>
              <p class="text-[11px] text-gray-600 mt-1 leading-relaxed">
                Create opportunities, manage volunteers, track impact.
              </p>
            </button>

            <!-- Platform Admin -->
            <button
              type="button"
              data-role="platform_admin"
              class="account-card text-left rounded-2xl border-2 border-gray-200 bg-white p-4 shadow-sm transition-all hover:border-gray-300"
            >
              <div class="flex items-center justify-between">
                <div class="w-9 h-9 rounded-xl bg-gray-200 flex items-center justify-center">
                  <svg class="w-4 h-4 text-gray-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 3 4 6v6c0 4.5 3.4 8 8 9 4.6-1 8-4.5 8-9V6l-8-3Z"/>
                  </svg>
                </div>
                <span
                  data-role-check
                  class="hidden bg-[#0051d5] flex items-center gap-1 text-white text-[10px] font-semibold rounded-full px-2 py-0.5"
                >
                  <img src="../images/tick.png" class="w-2.5 h-2" />
                  SELECTED
                </span>
              </div>
              <h3 class="font-bold text-sm text-[#172235] mt-3">Platform Admin</h3>
              <p class="text-[11px] text-gray-600 mt-1 leading-relaxed">
                Review NGO registrations, moderate reports, manage the platform.
              </p>
            </button>
          </div>

          <!-- Submit -->
          <button
            type="submit"
            id="submitBtn"
            class="w-full h-11 bg-[#0051d5] hover:bg-blue-700 text-white font-semibold rounded-xl transition flex items-center justify-center gap-2 cursor-pointer shadow-md"
          >
            Create Account &rarr;
          </button>

          <p class="text-center text-xs text-gray-500 mt-5 leading-relaxed">
            By creating an account, you agree to IMPACTRA's
            <a href="#" class="text-[#0051d5] font-medium hover:underline">Terms of Service</a>
            and
            <a href="#" class="text-[#0051d5] font-medium hover:underline">Privacy Policy</a>.
          </p>

          <p class="text-center text-sm text-gray-600 mt-6">
            Already have an account?
            <a href="login.html" class="text-[#0051d5] font-semibold hover:underline">Log in</a>
          </p>
        </form>
      </section>
    </main>

    <footer class="text-center text-xs text-gray-400 py-4">
      256-Bit SSL Encryption
    </footer>
  </body>
</html>
