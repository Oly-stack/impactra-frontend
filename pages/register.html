<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Impactra | Register</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="register.js" defer></script>
  </head>
  <body
    class="bg-[#eef7f2] opacity-0 transition-opacity duration-200 text-nearblack"
  >
    <main class="min-h-screen flex-items-center justify-center px-5 py-10">
      <div
        class="w-full max-w-6xl grid grid-cols-1 lg:grid-cols-2 gap 10 lg:gap-16"
      >
        <section class="relative hidden lg:block min-h-[600px]">
          <div class="ml-[80px]">
            <h1
              class="text-[44px] text-[#075B32] font-bold leading-none lg:text-[60px]"
            >
              Impac<span class="text-[#087B3E]">tra</span>
            </h1>
            <p class="mt-2 text-[15px] text-[#4d6a5f]">
              Connect. Contribute. Measure Impact.
            </p>
          </div>
          <div class="relative z-20 mt-4 ml-[50px] max-w-[340px] lg:mt-[45px]">
            <h2
              class="text-[40px] text-[#075B32] mb-[50px] font-bold leading-10 tracking-10"
            >
              Turn your <br />
              <span class="font-bold text-[#087B3E]"
                >kindness into real change.</span
              >
            </h2>
          </div>

          <div class="relative w-full max-w-xl">
            <img
              src="../images/children.jpeg"
              alt="Volunteers planting seedlings"
              class="w-full object-cover"
            />
            <div
              class="absolute top-0 left-0 right-0 h-24 bg-gradient-to-b from-[#eef7f2] to-transparent pointer-events-none"
            ></div>

            <div
              class="absolute bottom-0 left-0 right-0 h-28 bg-gradient-to-t from-[#eef7f2] to-transparent pointer-events-none"
            ></div>

            <div
              class="absolute top-0 bottom-0 left-0 w-24 bg-gradient-to-r from-[#eef7f2] to-transparent pointer-events-none"
            ></div>

            <div
              class="absolute top-0 bottom-0 right-0 w-24 bg-gradient-to-l from-[#eef7f2] to-transparent pointer-events-none"
            ></div>
          </div>
        </section>
        <section>
          <div
            div
            class="bg-white rounded-3xl shadow-sm border border-[#e3e9e5] px-7 py-8 sm:px-10 sm:py-10 w-full max-w-xl mx-auto"
          >
            <div class="mb-7">
              <div class="flex items-center gap-3">
                <h2 class="text-[28px] lg:text-[38pcx] sm:text-4xl font-bold">
                  Create an account
                </h2>

                <span class="text-2xl"> 🌱 </span>
              </div>

              <p class="mt-2 text-[#4B5560]">
                Join Impactra and be part of something meaningful.
              </p>
            </div>
            <form id="registerForm" class="space-y-5">
              <div>
                <label for="fullname" class="block mb-2 font-medium">
                  Full name
                </label>

                <div class="relative">
                  <i
                    data-lucide="user"
                    class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-[#4B8B78]"
                  ></i>

                  <input
                    type="text"
                    id="fullname"
                    name="fullname"
                    placeholder="Enter your full name"
                    required
                    class="w-full h-12 pl-12 pr-4 rounded-xl border border-[#cfdcd6] outline-none focus:border-[#087B3E] focus:ring-2 focus:ring-[#087B3E]/10 transition"
                  />
                </div>
              </div>

              <div>
                <label for="email" class="block mb-2 font-medium">
                  Email address
                </label>

                <div class="relative">
                  <i
                    data-lucide="mail"
                    class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-[#4B8B78]"
                  ></i>

                  <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    required
                    class="w-full h-12 pl-12 pr-4 rounded-xl border border-[#cfdcd6] outline-none focus:border-[#087B3E] focus:ring-2 focus:ring-[#087B3E]/10 transition"
                  />
                </div>
              </div>

              <div>
                <label for="phone" class="block mb-2 font-medium">
                  Phone number
                  <span class="text-[#4B5560] font-normal"> (optional) </span>
                </label>

                <div class="relative">
                  <i
                    data-lucide="phone"
                    class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-[#4B8B78]"
                  ></i>

                  <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="+234 801 234 5678"
                    class="w-full h-12 pl-12 pr-4 rounded-xl border border-[#cfdcd6] outline-none focus:border-[#087B3E] focus:ring-2 focus:ring-[#087B3E]/10 transition"
                  />
                </div>
              </div>

              <div>
                <label for="password" class="block mb-2 font-medium">
                  Password
                </label>

                <div class="relative">
                  <i
                    data-lucide="lock"
                    class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-[#4B8B78]"
                  ></i>

                  <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                    minlength="6"
                    class="w-full h-12 pl-12 pr-12 rounded-xl border border-[#cfdcd6] outline-none focus:border-[#087B3E] focus:ring-2 focus:ring-[#087B3E]/10 transition"
                  />

                  <button
                    type="button"
                    id="togglePassword"
                    class="absolute right-4 top-1/2 -translate-y-1/2 text-[#4B8B78] hover:text-[#087B3E]"
                  >
                    <i data-lucide="eye" id="passwordIcon" class="w-5 h-5"></i>
                  </button>
                </div>
              </div>

              <div>
                <label for="confirmPassword" class="block mb-2 font-medium">
                  Confirm password
                </label>

                <div class="relative">
                  <i
                    data-lucide="lock"
                    class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-[#4B8B78]"
                  ></i>

                  <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Confirm your password"
                    required
                    minlength="6"
                    class="w-full h-12 pl-12 pr-12 rounded-xl border border-[#cfdcd6] outline-none focus:border-[#087B3E] focus:ring-2 focus:ring-[#087B3E]/10 transition"
                  />

                  <button
                    type="button"
                    id="toggleConfirmPassword"
                    class="absolute right-4 top-1/2 -translate-y-1/2 text-[#4B8B78] hover:text-[#087B3E]"
                  >
                    <i data-lucide="eye" class="w-5 h-5"></i>
                  </button>
                </div>
              </div>

              <div class="flex items-start gap-3 text-sm">
                <input
                  type="checkbox"
                  id="terms"
                  required
                  class="mt-1 accent-[#087B3E]"
                />

                <label for="terms" class="text-[#4B5560]">
                  I agree to the
                  <a
                    href="#"
                    class="text-[#087B3E] font-medium hover:underline"
                  >
                    Terms and Conditions
                  </a>

                  and
                  <a
                    href="#"
                    class="text-[#087B3E] font-medium hover:underline"
                  >
                    Privacy Policy </a
                  >.
                </label>
              </div>

              <p id="errorMessage" class="hidden text-sm text-red-600"></p>

              <button
                type="submit"
                class="w-full h-12 text-[20px] rounded-xl bg-[#087B3E] hover:bg-[#0A8F4A] text-white font-semibold flex items-center justify-center gap-2 transition-colors duration-200"
              >
                Create account

                <i data-lucide="arrow-right" class="w-5 h-5"></i>
              </button>
            </form>

            <div class="flex items-center gap-4 my-7">
              <div class="h-px bg-[#e3e9e5] flex-1"></div>

              <span class="text-sm text-[#4B5560]"> OR </span>

              <div class="h-px bg-[#e3e9e5] flex-1"></div>
            </div>

            <p class="text-center text-sm text-[#4B5560]">
              Already have an account?

              <a
                href="login.html"
                id="loginLink"
                class="text-[#087B3E] font-semibold hover:text-[#0A8F4A] transition"
              >
                Log in →
              </a>
            </p>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
