<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IMPACTRA - Verify Email</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } }
    }
  </script>
  <script src="../API.js" defer></script>
</head>
<body class="bg-[#f5f8ff] text-[#0f172a] font-sans antialiased min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-white border border-slate-200/80 rounded-3xl p-8 sm:p-10 shadow-xl shadow-blue-900/5 text-center">

    <div class="w-16 h-16 rounded-2xl bg-blue-50 border border-blue-100 flex items-center justify-center text-blue-600 mx-auto mb-5 shadow-sm">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
              d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 002-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
      </svg>
    </div>

    <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight mb-2">Check your email</h1>
    <p class="text-slate-500 text-xs sm:text-sm leading-relaxed mb-8">
      We sent a 6-digit verification code to
      <span class="font-bold text-slate-700" id="userEmail"></span>
    </p>

    <!--form-->
    <form id="otpForm" novalidate>
      <div class="flex justify-center gap-2 sm:gap-3 mb-8" id="otpInputs">
        <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" class="otp-box w-11 h-12 sm:w-12 sm:h-14 text-center text-lg sm:text-xl font-extrabold text-slate-800 bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition shadow-sm" autofocus required />
        <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" class="otp-box w-11 h-12 sm:w-12 sm:h-14 text-center text-lg sm:text-xl font-extrabold text-slate-800 bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition shadow-sm" required />
        <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" class="otp-box w-11 h-12 sm:w-12 sm:h-14 text-center text-lg sm:text-xl font-extrabold text-slate-800 bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition shadow-sm" required />
        <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" class="otp-box w-11 h-12 sm:w-12 sm:h-14 text-center text-lg sm:text-xl font-extrabold text-slate-800 bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition shadow-sm" required />
        <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" class="otp-box w-11 h-12 sm:w-12 sm:h-14 text-center text-lg sm:text-xl font-extrabold text-slate-800 bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition shadow-sm" required />
        <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" class="otp-box w-11 h-12 sm:w-12 sm:h-14 text-center text-lg sm:text-xl font-extrabold text-slate-800 bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition shadow-sm" required />
      </div>

      <button type="submit" id="verifyBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm py-3.5 rounded-xl shadow-md shadow-blue-600/20 transition duration-150 disabled:opacity-70 disabled:cursor-not-allowed">
        Verify Email
      </button>
    </form>

    <div class="mt-6 text-xs text-slate-500">
      <p>Didn't get the code?</p>
      <button type="button" id="resendBtn" class="text-blue-600 font-bold hover:underline mt-1 focus:outline-none disabled:opacity-60 disabled:cursor-not-allowed">
        Resend code
      </button>
    </div>

  </div>

  <script>
  document.addEventListener("DOMContentLoaded", () => {
    "use strict";

    if (!window.API) {
      console.error("[verify-email] API client not found. Check the ../API.js path.");
      return;
    }

    /* TOAST */
    function toast(message, variant = "default") {
      let host = document.getElementById("toast-host");
      if (!host) {
        host = document.createElement("div");
        host.id = "toast-host";
        host.className =
          "pointer-events-none fixed bottom-6 left-1/2 z-[95] flex -translate-x-1/2 flex-col items-center gap-2";
        document.body.appendChild(host);
      }
      const palette = {
        default: "bg-[#0F172A] text-white",
        success: "bg-[#065F46] text-white",
        error:   "bg-[#991B1B] text-white",
        info:    "bg-[#1D4ED8] text-white",
      };
      const el = document.createElement("div");
      el.className = `pointer-events-auto rounded-lg px-4 py-2.5 text-sm font-medium shadow-lg ${palette[variant]}`;
      el.textContent = message;
      host.appendChild(el);
      setTimeout(() => {
        el.style.transition = "opacity .25s ease, transform .25s ease";
        el.style.opacity = "0";
        el.style.transform = "translateY(8px)";
        setTimeout(() => el.remove(), 260);
      }, 2800);
    }

    /* EMAIL DISPLAY */
    const params    = new URLSearchParams(window.location.search);
    const emailSpan = document.getElementById("userEmail");
    let displayEmail = params.get("email");

    if (!displayEmail) {
      try {
        const raw = sessionStorage.getItem("pendingUser");
        if (raw) {
          const pending = JSON.parse(raw);
          if (pending?.email) displayEmail = pending.email;
        }
      } catch (err) {
        console.warn("[verify-email] couldn't parse pendingUser:", err);
      }
    }

    if (emailSpan) emailSpan.textContent = displayEmail || "your email address";

    /* OTP INPUTS */
    const inputs = Array.from(document.querySelectorAll(".otp-box"));

    inputs.forEach((input, index) => {
      input.addEventListener("input", () => {
        input.value = input.value.replace(/[^0-9]/g, "");
        if (input.value && index < inputs.length - 1) inputs[index + 1].focus();
      });
      input.addEventListener("keydown", (e) => {
        if (e.key === "Backspace" && !input.value && index > 0) inputs[index - 1].focus();
        else if (e.key === "ArrowLeft" && index > 0)            inputs[index - 1].focus();
        else if (e.key === "ArrowRight" && index < inputs.length - 1) inputs[index + 1].focus();
        else if (e.key === "Enter") { e.preventDefault(); form?.requestSubmit(); }
      });
      input.addEventListener("paste", (e) => {
        e.preventDefault();
        const pasted = ((e.clipboardData || window.clipboardData).getData("text") || "")
          .replace(/[^0-9]/g, "").trim();
        if (pasted.length === 6) {
          pasted.split("").forEach((c, i) => { if (inputs[i]) inputs[i].value = c; });
          inputs[inputs.length - 1].focus();
        }
      });
    });

    const getCode  = () => inputs.map((i) => i.value.trim()).join("");
    const clearOtp = () => { inputs.forEach((i) => (i.value = "")); inputs[0]?.focus(); };
    const setOtpDisabled = (disabled) => inputs.forEach((i) => (i.disabled = disabled));

    /* VERIFY EMAIL */
    const form      = document.getElementById("otpForm");
    const verifyBtn = document.getElementById("verifyBtn");

    form?.addEventListener("submit", async (e) => {
      e.preventDefault();

      if (!displayEmail) {
        toast("We don't know which email to verify. Start over.", "error");
        return;
      }

      const code = getCode();
      if (code.length !== 6) {
        toast("Please enter all 6 digits", "error");
        inputs.find((i) => !i.value)?.focus();
        return;
      }

      const original = verifyBtn.innerHTML;
      verifyBtn.disabled = true;
      verifyBtn.textContent = "Verifying…";
      setOtpDisabled(true);

      try {
        await API.auth.verifyEmail(displayEmail, code);

        // Clear the pending signup stash — no longer needed
        try { sessionStorage.removeItem("pendingUser"); } catch (_) {}

        toast("Email verified — please log in", "success");

        // Route to login; login.js reads ?verified=1 to prefill + show a hint
        setTimeout(() => {
          window.location.href =
            `login.html?verified=1&email=${encodeURIComponent(displayEmail)}`;
        }, 800);

      } catch (err) {
        verifyBtn.disabled = false;
        verifyBtn.innerHTML = original;
        setOtpDisabled(false);
        clearOtp();

        const msg = err?.message || "Invalid or expired code";
        if (/code|invalid|expired/i.test(msg)) {
          inputs.forEach((i) => {
            i.classList.add("border-red-400", "ring-2", "ring-red-200");
            setTimeout(() => i.classList.remove("border-red-400", "ring-2", "ring-red-200"), 2000);
          });
        }
        toast(msg, "error");
      }
    });

    /* RESEND */
    const resendBtn = document.getElementById("resendBtn");
    let cooldown = 0;

    resendBtn?.addEventListener("click", async () => {
      if (cooldown > 0) return;
      if (!displayEmail) {
        toast("No email to resend to", "error");
        return;
      }

      const original = resendBtn.textContent;
      resendBtn.disabled = true;
      resendBtn.textContent = "Sending…";

      try {
        await API.auth.resendEmail(displayEmail, "email_verification");
        toast("A new code is on its way", "success");

        cooldown = 30;
        const tick = () => {
          if (cooldown <= 0) {
            resendBtn.disabled = false;
            resendBtn.textContent = original;
            return;
          }
          resendBtn.textContent = `Resend in ${cooldown}s`;
          cooldown--;
          setTimeout(tick, 1000);
        };
        tick();
      } catch (err) {
        resendBtn.disabled = false;
        resendBtn.textContent = original;
        toast(err?.message || "Couldn't resend code", "error");
      }
    });

    inputs[0]?.focus();
  });
  </script>
</body>
</html>
